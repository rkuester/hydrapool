# Builds the multi-arch hydrapool image for the fractional-difficulty fork and
# publishes it to this fork's own ghcr namespace.
#
# Kept separate from build-docker.yml, which is upstream's workflow: that one
# is amd64 only and pushes to the 256foundation namespace, neither of which
# suits a fork. Leaving it untouched keeps the diff against upstream small.
#
# Each arch builds on a native runner rather than under emulation, because a
# release build of the Rust tree takes hours under qemu. The two per-arch
# images are then joined into one manifest, so `docker pull` on either amd64
# or arm64 resolves to the right image.
name: Fractional image

on:
  push:
    tags:
      - 'v*-fractional-*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hydrapool

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.hydrapool
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Join into a multi-arch tag
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ github.ref_name }}" \
            "$IMAGE:${{ github.ref_name }}-amd64" \
            "$IMAGE:${{ github.ref_name }}-arm64"

      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}"
